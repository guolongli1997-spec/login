<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — FLY VIEW VISA</title>
<style>
  :root {
    --bg: #000000;
    --card: #0b0b0d;
    --border: #1e1e22;
    --text: #f5f5f7;
    --muted: #8a8a92;
    --accent: #2f6bff;
    --accent-2: #1a4fd6;
    --danger: #ff4d4d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 50% -10%, #101425 0%, #000 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px 28px 24px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 800; letter-spacing: .5px; font-size: 15px;
    color: var(--text);
  }
  .brand .logo .dot {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #7aa2ff);
    display: inline-block;
  }
  .brand h1 { font-size: 22px; margin: 14px 0 4px; }
  .brand p { color: var(--muted); font-size: 13px; margin: 0; }

  /* Tabs */
  .tabs {
    position: relative;
    display: grid; grid-template-columns: 1fr 1fr;
    background: #101014;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin: 22px 0 20px;
  }
  .tabs .indicator {
    position: absolute; top: 4px; bottom: 4px; left: 4px;
    width: calc(50% - 4px);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 9px;
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    z-index: 0;
  }
  .tabs[data-active="signup"] .indicator { transform: translateX(100%); }
  .tabs button {
    position: relative; z-index: 1;
    background: transparent; border: 0; color: var(--muted);
    font-size: 14px; font-weight: 600; padding: 10px 0;
    cursor: pointer; transition: color .2s;
  }
  .tabs button.active { color: #fff; }

  /* Forms */
  form { display: none; flex-direction: column; gap: 12px; }
  form.active { display: flex; }
  label { font-size: 12px; color: var(--muted); font-weight: 600; }
  input {
    width: 100%;
    background: #0f0f12;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47,107,255,.18);
  }
  .btn-primary {
    margin-top: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: 0; color: #fff; font-weight: 700;
    padding: 12px 14px; border-radius: 10px; font-size: 14px;
    cursor: pointer; transition: filter .2s, transform .05s;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; }

  .msg { font-size: 13px; min-height: 18px; margin-top: 4px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: #3ddc84; }

  /* Divider */
  .divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 12px; margin: 20px 0 14px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: var(--border);
  }

  /* Social buttons */
  .socials { display: flex; flex-direction: column; gap: 10px; }
  .social-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--border);
    background: #0f0f12; color: var(--text);
    font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background .2s, transform .05s;
  }
  .social-btn:hover { background: #15151a; }
  .social-btn:active { transform: translateY(1px); }
  .social-btn svg { width: 18px; height: 18px; }

  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo"><span class="dot"></span> FLY VIEW VISA</div>
      <h1 id="title">Welcome back</h1>
      <p id="subtitle">Sign in to continue your journey</p>
    </div>

    <div class="tabs" id="tabs" data-active="login">
      <div class="indicator"></div>
      <button type="button" data-tab="login" class="active">Log In</button>
      <button type="button" data-tab="signup">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="active" novalidate>
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" required />
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" required />
      <button class="btn-primary" type="submit" id="loginBtn">Log In</button>
      <div class="msg" id="loginMsg"></div>
    </form>

    <!-- SIGNUP -->
    <form id="signupForm" novalidate>
      <label for="signupName">Full name</label>
      <input id="signupName" type="text" autocomplete="name" placeholder="Jane Doe" required />
      <label for="signupEmail">Email</label>
      <input id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com" required />
      <label for="signupPassword">Password</label>
      <input id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 6 characters" required />
      <button class="btn-primary" type="submit" id="signupBtn">Create Account</button>
      <div class="msg" id="signupMsg"></div>
    </form>

    <div class="divider">or continue with</div>

    <div class="socials">
      <!-- UI-only social buttons. Add OAuth callbacks later. -->
      <button type="button" class="social-btn" data-provider="google">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
      <button type="button" class="social-btn" data-provider="facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/>
        </svg>
        Continue with Facebook
      </button>
      <button type="button" class="social-btn" data-provider="instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#FEDA75"/>
              <stop offset="35%" stop-color="#FA7E1E"/>
              <stop offset="65%" stop-color="#D62976"/>
              <stop offset="100%" stop-color="#962FBF"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#ig)"/>
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="#fff" stroke-width="1.8"/>
          <circle cx="17.3" cy="6.7" r="1.2" fill="#fff"/>
        </svg>
        Continue with Instagram
      </button>
    </div>

    <div class="foot">© FLY VIEW VISA — Secure sign-in</div>
  </div>

<script>
(function () {
  const tabs = document.getElementById("tabs");
  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");
  const loginForm = document.getElementById("loginForm");
  const signupForm = document.getElementById("signupForm");
  const loginMsg = document.getElementById("loginMsg");
  const signupMsg = document.getElementById("signupMsg");
  const loginBtn = document.getElementById("loginBtn");
  const signupBtn = document.getElementById("signupBtn");

  function setTab(tab) {
    tabs.dataset.active = tab;
    tabs.querySelectorAll("button").forEach((b) => {
      b.classList.toggle("active", b.dataset.tab === tab);
    });
    loginForm.classList.toggle("active", tab === "login");
    signupForm.classList.toggle("active", tab === "signup");
    if (tab === "login") {
      title.textContent = "Welcome back";
      subtitle.textContent = "Sign in to continue your journey";
    } else {
      title.textContent = "Create your account";
      subtitle.textContent = "Start your visa journey with us";
    }
    sessionStorage.setItem("ftv_preferred_tab", tab);
    const url = new URL(window.location.href);
    url.searchParams.set("mode", tab);
    history.replaceState(null, "", url);
  }

  tabs.querySelectorAll("button").forEach((b) => {
    b.addEventListener("click", () => setTab(b.dataset.tab));
  });

  // Initial tab: URL ?mode=... wins, then sessionStorage
  const params = new URLSearchParams(window.location.search);
  const urlMode = params.get("mode");
  const storedMode = sessionStorage.getItem("ftv_preferred_tab");
  const initial = (urlMode === "signup" || urlMode === "login")
    ? urlMode
    : (storedMode === "signup" || storedMode === "login" ? storedMode : "login");
  setTab(initial);

  function showMsg(el, text, kind) {
    el.textContent = text;
    el.className = "msg " + (kind || "");
  }

  async function postJSON(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    return { res, data };
  }

  function storeAndRedirect(data) {
    localStorage.setItem("ftv_auth_token", data.token);
    localStorage.setItem("ftv_user", JSON.stringify(data.user));
    window.location.href = data.redirect || "index.html";
  }

  // LOGIN
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    showMsg(loginMsg, "", "");
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    if (!email || !password) {
      showMsg(loginMsg, "Please enter your email and password.", "error");
      return;
    }
    loginBtn.disabled = true;
    loginBtn.textContent = "Signing in…";
    try {
      const { res, data } = await postJSON("/api/auth/login", { email, password });
      if (!res.ok || !data.success) {
        showMsg(loginMsg, data.error || "Login failed.", "error");
        return;
      }
      showMsg(loginMsg, "Success! Redirecting…", "ok");
      storeAndRedirect(data);
    } catch (err) {
      showMsg(loginMsg, "Network error. Please try again.", "error");
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Log In";
    }
  });

  // SIGNUP
  signupForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    showMsg(signupMsg, "", "");
    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;
    if (!name || !email || !password) {
      showMsg(signupMsg, "All fields are required.", "error");
      return;
    }
    if (password.length < 6) {
      showMsg(signupMsg, "Password must be at least 6 characters.", "error");
      return;
    }
    signupBtn.disabled = true;
    signupBtn.textContent = "Creating account…";
    try {
      const { res, data } = await postJSON("/api/auth/signup", { name, email, password });
      if (!res.ok || !data.success) {
        showMsg(signupMsg, data.error || "Signup failed.", "error");
        return;
      }
      showMsg(signupMsg, "Account created! Redirecting…", "ok");
      storeAndRedirect(data);
    } catch (err) {
      showMsg(signupMsg, "Network error. Please try again.", "error");
    } finally {
      signupBtn.disabled = false;
      signupBtn.textContent = "Create Account";
    }
  });

  // Social buttons (UI only)
  document.querySelectorAll(".social-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const provider = btn.dataset.provider;
      // TODO: OAuth callbacks.
      //   Google:    window.location.href = "/api/auth/oauth/google/start";
      //   Facebook:  window.location.href = "/api/auth/oauth/facebook/start";
      //   Instagram: window.location.href = "/api/auth/oauth/instagram/start";
      // Each should redirect to the provider's authorize URL, then handle
      // the callback at /api/auth/oauth/<provider>/callback, exchange the
      // code, upsert the user, issue our JWT and redirect to /index.html
      // with the token stored client-side.
      showMsg(
        provider === "google" ? loginMsg : signupMsg,
        provider[0].toUpperCase() + provider.slice(1) + " login coming soon.",
        ""
      );
    });
  });
})();
</script>
</body>
</html>
